name: Auto-Unzip and Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Auto-Find and Extract ZIP File
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "ZIP file found: $ZIP_FILE. Extracting..."
          unzip -o "$ZIP_FILE" -d ./extracted_project
          
          # Move extracted files to root if nested
          if [ -d "./extracted_project/OptimalBrowser_SourceCode" ]; then
            cp -r ./extracted_project/OptimalBrowser_SourceCode/* .
          else
            cp -r ./extracted_project/* .
          fi
        else
          echo "No ZIP file found, proceeding with raw repository files."
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Gradle Wrapper if Missing
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi

    - name: Make Gradlew Executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OptimalBrowser-APK
        path: app/build/outputs/apk/debug/app-debug.apk
