name: Build Android Browser APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Locate Project Root & Build
      run: |
        # Find where settings.gradle or build.gradle is located
        BUILD_FILE=$(find . -maxdepth 3 -name "settings.gradle.kts" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "build.gradle" | head -n 1)
        
        if [ -z "$BUILD_FILE" ]; then
          echo "ERROR: Could not find Gradle build files in repo!"
          exit 1
        fi

        PROJECT_DIR=$(dirname "$BUILD_FILE")
        echo "Found Gradle project at: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        # Generate wrapper if missing
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi

        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OptimalBrowser-APK
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
        
